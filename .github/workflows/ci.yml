name: Core CI/CD

on:
  push:
    branches: [DeployTest]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        run: |
          TAG=${GITHUB_SHA}
          docker build -t ghcr.io/${{ github.repository_owner }}/core-service:$TAG .
          docker push ghcr.io/${{ github.repository_owner }}/core-service:$TAG