name: Core CI/CD

on:
  push:
    branches: [DeployTest]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        run: |
          TAG=${GITHUB_SHA}
          docker build -t ghcr.io/${{ github.actor }}/core-service:$TAG .
          docker push ghcr.io/${{ github.actor }}/core-service:$TAG