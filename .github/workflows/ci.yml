name: Core CI/CD

on:
  push:
    branches: [DeployTest]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 

    steps:
      - uses: actions/checkout@v3

      - name: Login GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        run: |
          TAG=${GITHUB_SHA}
          IMAGE=ghcr.io/${{ github.repository }}/core-service:$TAG
          docker build -t $IMAGE .
          docker push $IMAGE